spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=notes-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://NOTES-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notes/**

spring.cloud.gateway.server.webflux.routes[2].id=label-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://LABEL-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/labels/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.server.webflux.routes[3].id=reminder-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://REMINDER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/reminders/**